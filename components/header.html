<!-- =========================================
     HAPROVEN | FLEXIBLE NAVIGATION HEADER
========================================= -->

<header class="site-header " id="siteHeader">

    <div class="header-container">

        <!-- BRAND -->
        <a href="/" class="site-brand" aria-label="Haproven Home">

            <img src="/assets/img/logo.png" alt="Haproven" class="brand-logo" width="40" height="40">

            <span class="brand-name">Haproven</span>

        </a>

        <!-- DESKTOP NAVIGATION -->
        <nav class="nav-menu" id="navMenu" aria-label="Main Navigation">

            <!-- MAIN LINKS -->
            <div class="nav-main" id="navMain">

                <a href="/" class="nav-link">Home</a>
                <a href="/projects/" class="nav-link">Projects</a>
                <a href="/events/" class="nav-link">Events</a>
                <a href="/community/" class="nav-link">Community</a>

            </div>

            <!-- MORE LINKS -->
            <div class="nav-more" id="navMore">

                <button type="button" class="more-toggle" id="moreToggle" aria-expanded="false"
                    aria-controls="moreDropdown">
                    More
                    <span class="more-arrow">⌄</span>
                </button>

                <div class="more-dropdown" id="moreDropdown">

                    <!-- EXTRA LINKS -->
                    <a href="/pages/" class="nav-link">Pages</a>
                    <a href="/teams/" class="nav-link">Teams</a>
                    <a href="/tools/" class="nav-link">Tools</a>
                    <a href="/about/" class="nav-link">About</a>
                    <a href="/contact/" class="nav-link">Contact</a>
                    <a href="/roadmap/" class="nav-link">Roadmap</a>
                    <a href="/haproid/" class="nav-link">HaproID</a>
                    <a href="/certificates/" class="nav-link">Certificates</a>
                    <a href="/benefits/" class="nav-link">Benefits</a>
                    <a href="/jobs/" class="nav-link">Jobs</a>
                    <a href="/search/" class="nav-link">Search</a>

                </div>

            </div>

        </nav>

        <!-- ACTIONS -->
        <div class="header-actions">

            <!-- THEME -->
            <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch theme" title="Switch theme">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2 M12 20v2
                             M4.93 4.93l1.42 1.42
                             M17.65 17.65l1.42 1.42
                             M2 12h2 M20 12h2
                             M4.93 19.07l1.42-1.42
                             M17.65 6.35l1.42-1.42" />
                </svg>
            </button>

            <!-- CTA -->
            <a href="/admission/" class="header-cta">
                Get Started
            </a>

            <!-- MOBILE MENU -->
            <button type="button" class="menu-toggle" id="menuToggle" aria-label="Open navigation" aria-expanded="false"
                aria-controls="navMenu">
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>

    </div>

</header>




<style>
    /* =========================================
   HAPROVEN | FLEXIBLE RESPONSIVE HEADER
========================================= */


    #siteHeader {
        padding: 5px 10%;
    }

    .site-header {
        --hp-blue: #2563eb;

        position: sticky;
        top: 0;
        z-index: 1000;

        border-bottom: 1px solid var(--header-border, #e5e7eb);
    }

    /* HEADER CONTAINER */

    .header-container {



        min-height: 72px;
        margin: auto;

        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
    }

    /* BRAND */

    .site-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;

        color: inherit;
        text-decoration: none;
    }

    .brand-logo {
        width: 38px;
        height: 38px;
        object-fit: contain;
    }

    .brand-name {
        font-size: 21px;
        font-weight: 750;
        letter-spacing: -0.5px;
    }

    /* DESKTOP NAVIGATION */

    .nav-menu {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        flex: 1;
    }

    .nav-main {
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .nav-link {
        display: flex;
        align-items: center;

        padding: 10px 13px;
        border-radius: 9px;

        color: var(--header-muted, #4b5563);
        text-decoration: none;

        font-size: 14px;
        font-weight: 550;

        transition: background .2s, color .2s;
    }

    .nav-link:hover,
    .nav-link.active {
        color: var(--hp-blue);
        background: var(--header-active-bg, #eff6ff);
    }

    /* MORE DROPDOWN */

    .nav-more {
        position: relative;
    }

    .more-toggle {
        display: flex;
        align-items: center;
        gap: 6px;

        padding: 10px 13px;
        border: 0;
        border-radius: 9px;

        background: transparent;
        color: inherit;

        font: inherit;
        font-size: 14px;
        cursor: pointer;
    }

    .more-toggle:hover,
    .nav-more.is-open .more-toggle {
        color: var(--hp-blue);
        background: var(--header-hover, #f3f4f6);
    }

    .more-arrow {
        font-size: 16px;
        transition: transform .2s;
    }

    .nav-more.is-open .more-arrow {
        transform: rotate(180deg);
    }

    /* DESKTOP DROPDOWN */

    .more-dropdown {
        position: absolute;
        top: calc(100% + 0px);
        right: 0;

        overflow-y: scroll;
        scrollbar-width: none;

        width: 240px;
        max-height: 65vh;
        padding: 8px;
        background: var(--header-bg, #ffffff);
        border: 1px solid var(--header-border, #e5e7eb);
        border-radius: 13px;

        box-shadow: 0 12px 35px rgba(0, 0, 0, .10);

        opacity: 0;
        visibility: hidden;
        pointer-events: none;

        transform: translateY(6px);

        transition: opacity .2s, transform .2s, visibility .2s;
    }

    .more-dropdown .nav-link {
        width: 90%;
        padding: 11px 10px;
    }

    /* DESKTOP MORE HOVER */



    @media (min-width: 851px) {


        .nav-more:hover .more-dropdown,
        .nav-more:focus-within .more-dropdown {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0);
        }

        .nav-more:hover .more-arrow {
            transform: rotate(180deg);
        }

    }

    /* HEADER ACTIONS */

    .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
    }

    .theme-toggle,
    .menu-toggle {
        width: 40px;
        height: 40px;

        display: flex;
        align-items: center;
        justify-content: center;

        border: 1px solid var(--header-border, #e5e7eb);
        border-radius: 10px;

        background: transparent;
        color: inherit;

        cursor: pointer;
    }

    .theme-toggle svg {
        width: 19px;
        height: 19px;
    }

    .theme-toggle:hover {
        color: var(--hp-blue);
    }

    /* CTA */

    .header-cta {
        padding: 10px 16px;
        border-radius: 9px;

        background: var(--hp-blue);
        color: #ffffff;

        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;

        transition: opacity .2s;
    }

    .header-cta:hover {
        opacity: .88;
    }

    /* MENU BUTTON */

    .menu-toggle {
        display: none;
        flex-direction: column;
        gap: 5px;
    }

    .menu-toggle span {
        width: 18px;
        height: 2px;

        border-radius: 3px;
        background: currentColor;

        transition: transform .2s, opacity .2s;
    }

    .menu-toggle.is-open span:nth-child(1) {
        transform: translateY(7px) rotate(45deg);
    }

    .menu-toggle.is-open span:nth-child(2) {
        opacity: 0;
    }

    .menu-toggle.is-open span:nth-child(3) {
        transform: translateY(-7px) rotate(-45deg);
    }

    /* =========================================
   MOBILE RIGHT SIDE DRAWER
========================================= */

    @media (max-width: 850px) {


        #siteHeader {
            padding: 5px 2%;
        }

        .header-container {
            width: 92%;
            min-height: 66px;
            gap: 10px;
        }

        .brand-name {
            font-size: 19px;
        }

        /* DRAWER */

        .nav-menu {
            position: fixed;

            top: 0;
            right: 0;
            left: auto;

            width: min(300px, 85vw);
            height: 100vh;
            height: 100dvh;

            padding: 0;

            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            gap: 0;

            background: var(--header-bg, #ffffff);
            color: var(--header-text, #111827);

            border-left: 1px solid var(--header-border, #e5e7eb);

            box-shadow: -12px 0 35px rgba(0, 0, 0, .10);

            overflow: hidden;

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transform: translateX(100%);

            transition:
                transform .25s ease,
                opacity .25s ease,
                visibility .25s ease;
        }

        /* OPEN DRAWER */

        .nav-menu.is-open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;

            transform: translateX(0);
        }

        /* ALL MAIN LINKS */

        .nav-main {
            display: flex;
            flex-direction: column;
            align-items: stretch;

            gap: 3px;

            padding: 12px 10px 0;
        }

        /* MORE SECTION */

        .nav-more {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;

            margin: 0;
        }

        /* MORE BUTTON HIDE ON MOBILE */

        .more-toggle {
            display: none;
        }

        /* ALL LINKS SHOW AT ONCE */

        .more-dropdown {
            position: static;

            width: 100%;
            max-height: none;

            flex: 1;
            min-height: 0;

            display: flex;
            flex-direction: column;
            align-items: stretch;

            overflow-y: auto;
            overscroll-behavior: contain;

            padding: 8px 10px 20px;
            margin: 0;

            border: 0;
            border-radius: 0;

            background: transparent;
            box-shadow: none;

            opacity: 1;
            visibility: visible;
            pointer-events: auto;

            transform: none;

            scrollbar-width: thin;
        }

        .more-dropdown .nav-link,
        .nav-main .nav-link {
            width: 100%;
            flex-shrink: 0;

            justify-content: flex-start;

            padding: 12px 14px;
            border-radius: 9px;

            font-size: 14px;
        }

        /* MOBILE BUTTON */

        .menu-toggle {
            display: flex;
            flex-shrink: 0;
        }

        /* CTA */

        .header-cta {
            padding: 9px 12px;
            font-size: 13px;
        }

    }

    /* SMALL MOBILE */

    @media (max-width: 380px) {

        .header-actions {
            gap: 7px;
        }

        .header-cta {
            display: none;
        }

        .nav-menu {
            width: 85vw;
        }

    }

    /* =========================================
   DARK THEME
========================================= */

    html.dark .site-header {
        --header-bg: #111827;
        --header-text: #f9fafb;
        --header-muted: #9ca3af;
        --header-border: #273244;
        --header-hover: #1f2937;
        --header-active-bg: #172554;
    }

    html.dark .nav-link.active {
        color: #60a5fa;
    }




    /* =========================================
   ACCESSIBILITY
========================================= */

    @media (prefers-reduced-motion: reduce) {

        .site-header *,
        .site-header *::before {
            transition: none !important;
        }

    }
</style>








<script>


    /* =========================================
       HAPROVEN | HEADER CONTROLLER
       External HTML + Responsive Navigation
    ========================================= */

    (() => {

        function initHeader() {

            const header = document.getElementById("siteHeader");

            if (!header || header.dataset.initialized) return;

            header.dataset.initialized = "true";

            const menu = header.querySelector("#navMenu");
            const menuToggle = header.querySelector("#menuToggle");

            const more = header.querySelector("#navMore");
            const moreToggle = header.querySelector("#moreToggle");

            const themeToggle = header.querySelector("#themeToggle");

            /* =====================================
               ACTIVE PAGE
            ===================================== */

            const currentPath =
                location.pathname.replace(/\/+$/, "") || "/";

            header.querySelectorAll(".nav-link").forEach(link => {

                const path = new URL(link.href, location.origin)
                    .pathname.replace(/\/+$/, "") || "/";

                const active = path === currentPath;

                link.classList.toggle("active", active);

                if (active) {
                    link.setAttribute("aria-current", "page");
                } else {
                    link.removeAttribute("aria-current");
                }

            });

            /* =====================================
               MOBILE MENU
            ===================================== */

            function closeMenu() {

                menu?.classList.remove("is-open");
                menuToggle?.classList.remove("is-open");

                menuToggle?.setAttribute("aria-expanded", "false");
                menuToggle?.setAttribute("aria-label", "Open navigation");

            }

            menuToggle?.addEventListener("click", () => {

                const open = menu.classList.toggle("is-open");

                menuToggle.classList.toggle("is-open", open);

                menuToggle.setAttribute("aria-expanded", String(open));

                menuToggle.setAttribute(
                    "aria-label",
                    open ? "Close navigation" : "Open navigation"
                );

                if (!open) closeMore();

            });

            /* =====================================
               MORE DROPDOWN
            ===================================== */

            function closeMore() {

                more?.classList.remove("is-open");

                moreToggle?.setAttribute("aria-expanded", "false");

            }

            /* MOBILE CLICK */

            moreToggle?.addEventListener("click", () => {

                if (window.matchMedia("(max-width: 850px)").matches) {

                    const open = more.classList.toggle("is-open");

                    moreToggle.setAttribute(
                        "aria-expanded",
                        String(open)
                    );

                }

            });

            /* DESKTOP HOVER */

            more?.addEventListener("mouseenter", () => {

                if (window.matchMedia("(min-width: 851px)").matches) {

                    moreToggle?.setAttribute("aria-expanded", "true");

                }

            });

            more?.addEventListener("mouseleave", () => {

                if (window.matchMedia("(min-width: 851px)").matches) {

                    moreToggle?.setAttribute("aria-expanded", "false");

                }

            });

            /* =====================================
               NAVIGATION CLICK
            ===================================== */

            menu?.addEventListener("click", event => {

                if (event.target.closest(".nav-link")) {

                    closeMenu();
                    closeMore();

                }

            });

            /* =====================================
               OUTSIDE CLICK
            ===================================== */

            document.addEventListener("click", event => {

                if (!header.contains(event.target)) {

                    closeMenu();
                    closeMore();

                }

            });

            /* =====================================
               ESCAPE KEY
            ===================================== */

            document.addEventListener("keydown", event => {

                if (event.key === "Escape") {

                    closeMenu();
                    closeMore();

                }

            });

            /* =====================================
               THEME TOGGLE
            ===================================== */

            themeToggle?.addEventListener("click", () => {

                const dark =
                    document.documentElement.classList.toggle("dark");

                themeToggle.setAttribute(
                    "aria-label",
                    dark ? "Switch to light theme" : "Switch to dark theme"
                );

            });

        }

        /* =====================================
           EXTERNAL HEADER DETECTION
        ===================================== */

        if (document.getElementById("siteHeader")) {

            initHeader();

        } else {

            const observer = new MutationObserver(() => {

                if (document.getElementById("siteHeader")) {

                    initHeader();

                    observer.disconnect();

                }

            });

            observer.observe(document.body, {
                childList: true,
                subtree: true
            });

        }

    })();
</script>
