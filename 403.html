
<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>403 - Forbidden | Haproven</title>
    <meta name="robots" content="noindex, follow">

    <link rel="icon" href="/assets/img/favicon.ico">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --danger: #ef4444;
            --warning: #fbbf24;
            --bg: #0b1020;
            --card: #111827;
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background:
                radial-gradient(circle at top, #3b1e1e, transparent 60%),
                var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .error-container {
            width: 100%;
            max-width: 520px;
            padding: 35px 25px;
            text-align: center;
            border-radius: 22px;
        }

        .error-code {
            font-size: clamp(5rem, 20vw, 8rem);
            font-weight: 900;
            line-height: 1;
            color: var(--danger);
            text-shadow: 0 0 30px rgba(239,68,68,.25);
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 1.7rem;
            margin-bottom: 15px;
        }

        .error-message {
            color: var(--muted);
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .countdown-box {
            padding: 15px;
            margin: 20px 0;
            background: rgba(255,255,255,.04);
            border-radius: 12px;
        }

        #countdown {
            color: var(--warning);
            font-weight: 800;
            font-size: 1.3rem;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 13px;
            margin-bottom: 20px;
            border-radius: 30px;
            font-size: .8rem;
            background: rgba(239,68,68,.12);
            color: #fca5a5;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: var(--danger);
            border-radius: 50%;
        }

        .btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 22px;
            border: none;
            border-radius: 12px;
            background: var(--danger);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: .2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn.secondary {
            background: var(--primary);
        }

        .btn.hidden {
            display: none !important;
        }

        #warning {
            display: none;
            color: var(--warning);
            font-size: .9rem;
            line-height: 1.6;
            margin-top: 20px;
        }

        #warning.show {
            display: block;
        }

        .footer-text {
            color: #64748b;
            font-size: .75rem;
            margin-top: 25px;
        }

        @media(max-width:480px) {
            .error-container {
                padding: 30px 18px;
            }

            .btn-row {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="error-container">

        <div class="status">
            <span class="status-dot"></span>
            ACCESS RESTRICTED
        </div>

        <h1 class="error-code">403</h1>

        <h2 class="error-title">Access Forbidden</h2>

        <p class="error-message">
            Aapko is page ko access karne ki permission nahi hai.
        </p>

        <div class="countdown-box">
            <p>Automatic navigation in</p>
            <span id="countdown">5</span> seconds
        </div>

        <div class="btn-row">

            <button
                id="backBtn"
                class="btn secondary hidden"
                type="button">
                ← Wapas Jayein
            </button>

            <a
                id="homeBtn"
                class="btn hidden"
                href="/">
                🏠 Home Par Jayein
            </a>

        </div>

        <div id="warning">
            ⚠️ Developer Tools detected.
            Navigation buttons temporarily hidden.
        </div>


    </main>

    <script>
        (() => {
            "use strict";

            /* ================= CONFIG ================= */

            const CONFIG = {
                homeURL: "/",
                autoBackTime: 5,
                checkInterval: 500,
                sizeThreshold: 160,
                timingThreshold: 100,
                confirmCycles: 2,
                lockKey: "dt_lock",
                returnKey: "dt_return"
            };

            /* ================= ELEMENTS ================= */

            const backBtn = document.getElementById("backBtn");
            const homeBtn = document.getElementById("homeBtn");
            const warning = document.getElementById("warning");
            const countdown = document.getElementById("countdown");

            /* ================= STATE ================= */

            let devtoolsDetected = false;
            let previousState = null;
            let confirmCount = 0;
            let remaining = CONFIG.autoBackTime;
            let navigationStarted = false;
            let timer = null;

            /* ================= DEVTOOLS CHECK ================= */

            function detectSize() {
                return (
                    window.outerWidth - window.innerWidth >
                        CONFIG.sizeThreshold ||
                    window.outerHeight - window.innerHeight >
                        CONFIG.sizeThreshold
                );
            }

            function detectDebugger() {
                const start = performance.now();
                debugger;
                return performance.now() - start >
                    CONFIG.timingThreshold;
            }

            function detectDevTools() {
                return detectSize() || detectDebugger();
            }

            function confirmedDetection() {
                const detected = detectDevTools();

                if (detected === previousState) {
                    confirmCount++;
                } else {
                    previousState = detected;
                    confirmCount = 1;
                }

                return confirmCount >= CONFIG.confirmCycles
                    ? detected
                    : devtoolsDetected;
            }

            /* ================= BUTTON CONTROL ================= */

            function setProtection(active) {
                if (devtoolsDetected === active) return;

                devtoolsDetected = active;

                if (active) {
                    sessionStorage.setItem(CONFIG.lockKey, "1");

                    backBtn.classList.add("hidden");
                    homeBtn.classList.add("hidden");
                    warning.classList.add("show");

                } else {
                    sessionStorage.removeItem(CONFIG.lockKey);

                    backBtn.classList.remove("hidden");
                    homeBtn.classList.remove("hidden");
                    warning.classList.remove("show");
                }
            }

            function checkProtection() {
                setProtection(confirmedDetection());
            }

            /* ================= NAVIGATION ================= */

            function goHome() {
                if (navigationStarted) return;

                navigationStarted = true;
                clearInterval(timer);

                sessionStorage.removeItem(CONFIG.lockKey);

                location.replace(CONFIG.homeURL);
            }

            function goBack() {
                if (navigationStarted) return;

                navigationStarted = true;
                clearInterval(timer);

                sessionStorage.removeItem(CONFIG.lockKey);

                const returnURL =
                    sessionStorage.getItem(CONFIG.returnKey);

                sessionStorage.removeItem(CONFIG.returnKey);

                if (returnURL) {
                    location.replace(returnURL);
                } else if (history.length > 1 && document.referrer) {
                    history.back();
                } else {
                    location.replace(CONFIG.homeURL);
                }
            }

            backBtn.addEventListener("click", goBack);

            homeBtn.addEventListener("click", (event) => {
                event.preventDefault();
                goHome();
            });

            /* ================= PROTECTION LOOP ================= */

            checkProtection();

            const protectionTimer = setInterval(
                checkProtection,
                CONFIG.checkInterval
            );

            window.addEventListener("resize", checkProtection);

            window.addEventListener("pageshow", (event) => {
                if (event.persisted) {
                    location.reload();
                }
            });

            /* ================= AUTO BACK ================= */

            timer = setInterval(() => {

                if (navigationStarted) {
                    clearInterval(timer);
                    return;
                }

                // Protection active: pause countdown
                if (devtoolsDetected) return;

                remaining--;

                countdown.textContent = Math.max(remaining, 0);

                if (remaining <= 0) {
                    clearInterval(timer);
                    clearInterval(protectionTimer);
                    goBack();
                }

            }, 1000);

        })();
    </script>

</body>
</html>
